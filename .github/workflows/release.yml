# 发版流水线（市场规范约定：tag = manifest version，无 v 前缀）。
# 本插件是无构建的单文件 ESM 插件，产物为 main.js + manifest.json + checksums.txt。
# 推送 tag 触发：校验 manifest 必填字段 → 校验 tag 与版本一致 → 生成 checksums → 发 Release。
name: release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG != manifest version $VERSION"
            exit 1
          fi
          node -e "
            const m = require('./manifest.json');
            const required = ['id','name','version','minAppVersion','author','description','repo','tier','license'];
            for (const k of required) {
              if (typeof m[k] !== 'string' || !m[k].trim()) {
                console.error('manifest missing field: ' + k);
                process.exit(1);
              }
            }
            if (!/^[\w.-]+\/[\w.-]+$/.test(m.repo)) {
              console.error('manifest.repo must be owner/repo form');
              process.exit(1);
            }
            if ([...(m.name)].length > 30) {
              console.error('manifest.name exceeds 30 chars');
              process.exit(1);
            }
            if ([...(m.description)].length > 120) {
              console.error('manifest.description exceeds 120 chars');
              process.exit(1);
            }
            console.log('manifest ok: ' + m.id + ' v' + m.version);
          "

      - name: Generate checksums
        run: |
          sha256sum main.js manifest.json > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release with plugin artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            checksums.txt
